name: Deploy completo

# Pipeline unica: provisiona e publica todo o Mechanical Hub no AWS Lab, na
# ordem correta, com um unico disparo (Actions -> Deploy completo -> Run workflow).
#
#   infra -> database -> [orders, billing, stock, orchestrator] -> auth
#
# Cada etapa e o `deploy.yml` do respectivo repositorio, chamado como reusable
# workflow. Os repositorios chamados precisam permitir o uso por outros repos
# da organizacao (Settings -> Actions -> General -> Access) e os secrets ficam
# no nivel da organizacao, repassados por `secrets: inherit`.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo
        required: true
        default: production
        type: choice
        options: [production, staging]
      ate_etapa:
        description: Ultima etapa a executar (as seguintes sao puladas)
        required: true
        default: auth
        type: choice
        options: [infra, database, auth]
      mongodb_persistencia:
        description: >-
          MongoDB em PVC (EBS gp3). Desmarque se o driver EBS CSI nao
          funcionar no Lab — cai para emptyDir.
        required: false
        default: true
        type: boolean
      criar_usuarios_e_role:
        description: >-
          Criar os usuarios dos servicos (sql/service-user.sql) e a role de
          autenticacao (sql/auth-database-role.sql). Necessario no primeiro
          deploy e a cada recriacao dos RDS, antes do deploy dos servicos.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-all
  cancel-in-progress: false

jobs:
  infra:
    name: 1 - Infraestrutura base
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  database:
    name: 2 - Banco de dados
    needs: infra
    if: inputs.ate_etapa == 'database' || inputs.ate_etapa == 'auth'
    uses: mechanical-hub-fiap/mechanical-hub-database/.github/workflows/deploy.yml@main
    with:
      environment: ${{ inputs.environment }}
      mongodb_persistencia: ${{ inputs.mongodb_persistencia }}
      criar_usuarios_e_role: ${{ inputs.criar_usuarios_e_role }}
    secrets: inherit

  # --- Microsservicos (Fase F) -------------------------------------------------
  # Cada um e o deploy.yml do repositorio (build -> ECR -> kubectl apply), chamado
  # com workflow_call. Dependem so do `database` e rodam em paralelo.
  # Um microsservico novo: copiar um bloco abaixo e acrescentar o job ao `needs`
  # do auth.

  orders:
    name: 3 - orders
    needs: database
    if: inputs.ate_etapa == 'auth'
    uses: mechanical-hub-fiap/mechanical-hub-orders/.github/workflows/deploy.yml@main
    secrets: inherit

  billing:
    name: 3 - billing
    needs: database
    if: inputs.ate_etapa == 'auth'
    uses: mechanical-hub-fiap/mechanical-hub-billing/.github/workflows/deploy.yml@main
    secrets: inherit

  stock:
    name: 3 - stock
    needs: database
    if: inputs.ate_etapa == 'auth'
    uses: mechanical-hub-fiap/mechanical-hub-stock/.github/workflows/deploy.yml@main
    secrets: inherit

  orchestrator:
    name: 3 - orchestrator
    # Le o MongoDB e o Secret do usuario dele, criados pelo database.
    needs: database
    if: inputs.ate_etapa == 'auth'
    uses: mechanical-hub-fiap/mechanical-hub-orchestrator/.github/workflows/deploy.yml@main
    secrets: inherit

  auth:
    name: 4 - Autenticacao (Lambda + API Gateway)
    # A Lambda le o banco do orders (tabelas criadas pelas migrations dele) e o smoke
    # test exercita orders e billing; stock e orchestrator completam o fluxo da saga.
    needs: [database, orders, billing, stock, orchestrator]
    if: inputs.ate_etapa == 'auth'
    uses: mechanical-hub-fiap/mechanical-hub-auth/.github/workflows/deploy.yml@main
    secrets: inherit
